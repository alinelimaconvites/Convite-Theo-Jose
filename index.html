<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Convite Especial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MÚSICA DE FUNDO -->
    <audio id="musica" loop>
        <source src="./musica.mp3" type="audio/mpeg">
    </audio>

    <!-- CONTROLE DE ÁUDIO -->
    <button id="botao-musica" class="botao-musica" onclick="alternarMusica()">🔊</button>

    <!-- TELA 0: BOTÃO INICIAL (Necessário para autorizar o áudio no celular) -->
    <section id="inicio" class="pagina ativa">
        <div class="conteudo-inicio">
            <h2>Você recebeu um convite!</h2>
            <button class="btn-abrir" onclick="iniciarConvite()">Abrir Convite ✨</button>
        </div>
    </section>

    <!-- PÁGINA 1: VÍDEO 1 -->
    <section id="pagina1" class="pagina">
        <video id="vid1" class="video-convite" playsinline muted>
            <source src="./video.mp4" type="video/mp4">
        </video>
    </section>

   <!-- ==================== -->
    <!-- PÁGINA 2 DAS NUVENS (COM OS 4 BOTÕES) -->
    <!-- ==================== -->

    <section id="pagina2" class="pagina ativa"> <!-- (Mude para ativa ou chame pelo script) -->

        <!-- Imagem de fundo do convite -->
        <img src="./page2.png" alt="Convite" class="imagem-convite">

        <!-- 1. BOTÃO CONFIRMAÇÃO -->
        <a href="https://wa.me/5581983553729" target="_blank" class="btn-nuvem btn-confirmacao"></a>

        <!-- 2. BOTÃO PRESENTES -->
        <button class="btn-nuvem btn-presentes" onclick="mostrarPagina('pagina3')"></button>

        <!-- 3. BOTÃO LOCAL -->
        <a href="https://maps.app.goo.gl/H8YVceG6UMLabULH6" target="_blank" class="btn-nuvem btn-local"></a>

        <!-- 4. BOTÃO CONTAGEM REGRESSIVA -->
        <a href="https://onlinealarmkur.com/countdown/pt/#2026-11-14T18%3A00%26tz%3DAmerica%2FSao_Paulo" class="btn-nuvem btn-contagem"></a>

    </section>

    <!-- PÁGINA 3: LISTA DE PRESENTES (PNG OU DETALHES) -->
    <section id="pagina3" class="pagina">
           <video id="vid1" class="video-convite" playsinline muted>
            <source src="./video2.mp4" type="video/mp4">
        </video>
            <button class="btn-interativo btn-voltar" onclick="mostrarPagina('pagina2')">
               <!-- ⬅️ Voltar ao Convite-->
            </button>
    </section>

    <script src="script.js"></script>
</body>

</html>
