<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Convite Especial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MÚSICA DE FUNDO -->
    <audio id="musica" loop>
        <source src="./musica.mp3" type="audio/mpeg">
    </audio>

    <!-- CONTROLE DE ÁUDIO -->
    <button id="botao-musica" class="botao-musica" onclick="alternarMusica()">🔊</button>

    <!-- TELA 0: BOTÃO INICIAL (Necessário para autorizar o áudio no celular) -->
    <section id="inicio" class="pagina ativa">
        <div class="conteudo-inicio">
            <h2>Você recebeu um convite!</h2>
            <button class="btn-abrir" onclick="iniciarConvite()">Abrir Convite ✨</button>
        </div>
    </section>

    <!-- PÁGINA 1: VÍDEO 1 -->
    <section id="pagina1" class="pagina">
        <video id="vid1" class="video-convite" playsinline muted>
            <source src="./video.MP4" type="video/mp4">
        </video>
    </section>

       <!-- PÁGINA 2: TELA FINAL COM IMAGEM PNG E BOTÕES -->
    <section id="pagina2" class="pagina">
        <div class="card-convite">
            <img src="./page1.PNG" alt="Convite" class="imagem-convite">

            <!-- BOTÃO LOCAL -->
            <a href="https://maps.app.goo.gl/H8YVceG6UMLabULH6" target="_blank" class="btn-interativo btn-local">
                <!--📍 Ver Localização-->
            </a>

            <!-- BOTÃO CONFIRMAÇÃO -->
            <a href="https://wa.me/5581983553729" target="_blank" class="btn-interativo btn-confirmacao">
              <!--  ✅ Confirmar Presença-->
            </a>

            <!-- BOTÃO PRESENTES -->
            <button class="btn-interativo btn-presentes" onclick="mostrarPagina('pagina3')">
                <!--🎁 Lista de Presentes-->
            </button>
        </div>
    </section>

    <!-- PÁGINA 3: LISTA DE PRESENTES (PNG OU DETALHES) -->
    <section id="pagina3" class="pagina">
        <div class="card-convite">
            <img src="./page3.PNG" alt="Lista de Presentes" class="imagem-convite">
            
            <button class="btn-interativo btn-voltar" onclick="mostrarPagina('pagina5')">
                ⬅️ Voltar ao Convite
            </button>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
